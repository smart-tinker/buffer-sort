<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сортировочная</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.mjs"></script></head><body>
<main><header><div class="brand"><svg aria-hidden="true" viewBox="0 0 56 56"><path d="M6 15 28 5 50 15v26L28 51 6 41ZM6 15l22 11 22-11M28 26v25M17 10l23 11v10" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg><h1>СОРТИРОВОЧНАЯ</h1></div><p id="stage">01 / 06</p></header>
<div class="meta"><div class="modes" aria-label="Режим" role="group"><button id="campaign" type="button" aria-pressed="true">Уровни</button><button id="daily" type="button" aria-pressed="false">Дневная накладная</button></div><p id="record"></p></div>
<p class="intro">Два заказа, одна лента. Отправляй коробки по накладным или временно откладывай их в буфер.</p>
<section class="tray" aria-labelledby="line-title"><h2 id="line-title">ВХОДЯЩАЯ ОЧЕРЕДЬ <span>→</span></h2><div class="belt"><button id="front" type="button" aria-pressed="true"></button><div id="feed" aria-label="Следующие коробки"></div></div></section>
<section class="tray" aria-labelledby="buffer-title"><h2 id="buffer-title">БУФЕР <span id="slots">0 / 3</span></h2><div class="buffer"><div id="buffer"></div><button id="park" type="button">Отложить с ленты</button></div></section>
<section class="orders" aria-label="Накладные"><article><h2>ЗАКАЗ А</h2><ol id="queue0"></ol><button id="send0" type="button">Отправить в А</button></article><article><h2>ЗАКАЗ Б</h2><ol id="queue1"></ol><button id="send1" type="button">Отправить в Б</button></article></section>
<div class="footer"><p id="status" role="status"></p><button id="reset" type="button">Сначала</button><button id="next" type="button" hidden>Дальше</button></div>
</main></body></html>
